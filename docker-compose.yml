# Run the published image:        docker compose up -d
# Build from source and run it:   docker compose up -d --build
#
# Settings come from the environment or a .env file (copy sample.env to .env).
# APP_VERSION selects the image tag and is stamped into the build. It defaults to "latest".
# Find the current version with: node scripts/release.js --show
services:
  certificate-workbench:
    container_name: cert-workbench
    image: ghcr.io/sunnykatiyar50/certificate-workbench:${APP_VERSION:-latest}
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-}
        REVISION: ${GIT_SHA:-}
    ports:
      - "${HOST_PORT:-33003}:33003"
    environment:
      # Sign-in. See sample.env. Compose refuses to start until the two required values are set.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (copy sample.env)}
      USERS: ${USERS:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env (copy sample.env)}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      VAULT_KEY: ${VAULT_KEY:-}
      # Set to 1 when running behind a reverse proxy so rate limiting sees client IPs.
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      # User history database (the root filesystem is read-only).
      - cert-workbench-data:/app/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  cert-workbench-data:
